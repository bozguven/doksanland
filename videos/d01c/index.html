<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-ext-900-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Unbounded"; font-weight: 800; src: url("assets/fonts/unbounded-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Unbounded"; font-weight: 800; src: url("assets/fonts/unbounded-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; src: url("assets/fonts/fira-sans-condensed-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; src: url("assets/fonts/fira-sans-condensed-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url("assets/fonts/fira-sans-condensed-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url("assets/fonts/fira-sans-condensed-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      :root { --plum: #2b1055; --cream: #fff8ec; --yellow: #ffd23f; --coral: #ff5e5b; --teal: #1fb5a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--plum); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Fira Sans Condensed", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .tag { left: 0; width: 1080px; text-align: center; font: 700 40px/1 "Fira Sans Condensed"; letter-spacing: 0.22em; }
      .head { left: 90px; width: 900px; text-align: center; font: 900 96px/1.02 "Unbounded"; letter-spacing: -0.03em; text-wrap: balance; }
      .art { left: 0; width: 1080px; }
      #s1 { background: var(--plum); } #s2 { background: var(--coral); } #s3 { background: var(--yellow); }
      #s4 { background: var(--teal); } #s5 { background: var(--cream); }
      .disc { position: absolute; transform-style: preserve-3d; }
      .face { position: absolute; inset: 0; backface-visibility: hidden; }
      .face.back { transform: rotateY(180deg); }
      #wordmark { left: 0; width: 1080px; text-align: center; font: 800 44px/1 "Unbounded"; letter-spacing: 0.14em; color: var(--plum); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fps="30">

      <!-- 0.0-2.0 hook: the bag, a racing heart -->
      <div id="s1" class="scene clip" data-start="0" data-duration="2" data-track-index="0">
        <div id="s1-tag" class="abs tag" style="top: 280px; color: var(--yellow)">PAKETTEN NE ÇIKTI?</div>
        <div id="s1-head" class="abs head" style="top: 350px; color: var(--cream)">PAKETİ AÇARKEN KALBİN HIZLANIRDI</div>
        <svg id="s1-bag" class="abs" style="left: 340px; top: 850px" width="400" height="520" viewBox="0 0 400 520">
          <path d="M20,60 L40,40 L60,60 L80,40 L100,60 L120,40 L140,60 L160,40 L180,60 L200,40 L220,60 L240,40 L260,60 L280,40 L300,60 L320,40 L340,60 L360,40 L380,60 L372,280 L380,480 L360,500 L340,480 L320,500 L300,480 L280,500 L260,480 L240,500 L220,480 L200,500 L180,480 L160,500 L140,480 L120,500 L100,480 L80,500 L60,480 L40,500 L20,480 L28,280 Z" fill="#ff5e5b" />
          <rect x="24" y="96" width="352" height="34" fill="#fff8ec" />
          <rect x="24" y="420" width="352" height="22" fill="#fff8ec" />
          <polygon points="200,170 222,215 270,200 248,245 292,268 246,286 262,334 214,316 200,364 186,316 138,334 154,286 108,268 152,245 130,200 178,215" fill="#ffd23f" />
          <text x="200" y="300" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="96" fill="#2b1055">?</text>
        </svg>
        <svg id="s1-heart" class="abs" style="left: 200px; top: 800px" width="150" height="140" viewBox="0 0 150 140">
          <path d="M75,130 C20,90 0,60 10,35 C20,8 55,2 75,32 C95,2 130,8 140,35 C150,60 130,90 75,130 Z" fill="#ff5e5b" stroke="#fff8ec" stroke-width="8" />
        </svg>
      </div>

      <!-- 2.0-4.0 tear: top flies off, chips burst -->
      <div id="s2" class="scene clip" data-start="2" data-duration="2" data-track-index="0">
        <div id="s2-head" class="abs head" style="top: 330px; color: var(--plum)">ÇITIR ÇITIR… AMA ÖNCE O</div>
        <svg id="s2-bag" class="abs" style="left: 340px; top: 900px" width="400" height="520" viewBox="0 0 400 520">
          <path d="M28,110 L372,110 L372,280 L380,480 L360,500 L340,480 L320,500 L300,480 L280,500 L260,480 L240,500 L220,480 L200,500 L180,480 L160,500 L140,480 L120,500 L100,480 L80,500 L60,480 L40,500 L20,480 L28,280 Z" fill="#2b1055" />
          <rect x="28" y="420" width="344" height="22" fill="#fff8ec" />
          <polygon points="200,170 222,215 270,200 248,245 292,268 246,286 262,334 214,316 200,364 186,316 138,334 154,286 108,268 152,245 130,200 178,215" fill="#ffd23f" />
          <text x="200" y="300" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="96" fill="#2b1055">?</text>
        </svg>
        <svg id="s2-top" class="abs" style="left: 340px; top: 900px" width="400" height="130" viewBox="0 0 400 130">
          <path d="M20,60 L40,40 L60,60 L80,40 L100,60 L120,40 L140,60 L160,40 L180,60 L200,40 L220,60 L240,40 L260,60 L280,40 L300,60 L320,40 L340,60 L360,40 L380,60 L372,110 L340,124 L300,106 L260,124 L220,106 L180,124 L140,106 L100,124 L60,106 L28,110 Z" fill="#2b1055" />
          <rect x="24" y="96" width="352" height="12" fill="#fff8ec" />
        </svg>
        <div id="s2-chips" class="abs art" style="top: 0; height: 1920px">
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#ffd23f" stroke="#2b1055" stroke-width="5" /></svg>
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#fff8ec" stroke="#2b1055" stroke-width="5" /></svg>
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#ffd23f" stroke="#2b1055" stroke-width="5" /></svg>
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#fff8ec" stroke="#2b1055" stroke-width="5" /></svg>
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#ffd23f" stroke="#2b1055" stroke-width="5" /></svg>
          <svg class="chip abs" style="left: 500px; top: 960px" width="90" height="64" viewBox="0 0 90 64"><ellipse cx="45" cy="32" rx="42" ry="28" fill="#fff8ec" stroke="#2b1055" stroke-width="5" /></svg>
        </div>
      </div>

      <!-- 4.0-6.5 something glows at the bottom -->
      <div id="s3" class="scene clip" data-start="4" data-duration="2.5" data-track-index="0">
        <svg id="s3-rays" class="abs" style="left: 140px; top: 640px" width="800" height="800" viewBox="-400 -400 800 800">
          <g fill="#fff8ec" opacity="0.9">
            <polygon points="0,0 -30,-400 30,-400" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(30)" />
            <polygon points="0,0 -30,-400 30,-400" transform="rotate(60)" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(90)" />
            <polygon points="0,0 -30,-400 30,-400" transform="rotate(120)" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(150)" />
            <polygon points="0,0 -30,-400 30,-400" transform="rotate(180)" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(210)" />
            <polygon points="0,0 -30,-400 30,-400" transform="rotate(240)" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(270)" />
            <polygon points="0,0 -30,-400 30,-400" transform="rotate(300)" /><polygon points="0,0 -30,-400 30,-400" transform="rotate(330)" />
          </g>
        </svg>
        <div id="s3-head" class="abs head" style="top: 330px; color: var(--plum)">PAKETİN DİBİNDE BİR ŞEY PARLIYOR</div>
        <svg id="s3-bag" class="abs" style="left: 340px; top: 900px" width="400" height="520" viewBox="0 0 400 520">
          <path d="M28,110 L372,110 L372,280 L380,480 L360,500 L340,480 L320,500 L300,480 L280,500 L260,480 L240,500 L220,480 L200,500 L180,480 L160,500 L140,480 L120,500 L100,480 L80,500 L60,480 L40,500 L20,480 L28,280 Z" fill="#ff5e5b" />
          <ellipse cx="200" cy="112" rx="172" ry="26" fill="#2b1055" />
          <polygon points="200,170 222,215 270,200 248,245 292,268 246,286 262,334 214,316 200,364 186,316 138,334 154,286 108,268 152,245 130,200 178,215" fill="#fff8ec" />
          <text x="200" y="300" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="96" fill="#2b1055">?</text>
        </svg>
        <svg id="s3-glint" class="abs" style="left: 470px; top: 880px" width="140" height="140" viewBox="-70 -70 140 140">
          <path d="M0,-70 C8,-10 10,-8 70,0 C10,8 8,10 0,70 C-8,10 -10,8 -70,0 C-10,-8 -8,-10 0,-70 Z" fill="#fff8ec" stroke="#2b1055" stroke-width="5" />
        </svg>
      </div>

      <!-- 6.5-9.0 payoff: TAZO #01 spins -->
      <div id="s4" class="scene clip" data-start="6.5" data-duration="2.5" data-track-index="0">
        <svg id="s4-burst" class="abs" style="left: 40px; top: 560px" width="1000" height="1000" viewBox="-500 -500 1000 1000">
          <g fill="#2b1055" opacity="0.18">
            <polygon points="0,0 -60,-500 60,-500" /><polygon points="0,0 -60,-500 60,-500" transform="rotate(40)" />
            <polygon points="0,0 -60,-500 60,-500" transform="rotate(80)" /><polygon points="0,0 -60,-500 60,-500" transform="rotate(120)" />
            <polygon points="0,0 -60,-500 60,-500" transform="rotate(160)" /><polygon points="0,0 -60,-500 60,-500" transform="rotate(200)" />
            <polygon points="0,0 -60,-500 60,-500" transform="rotate(240)" /><polygon points="0,0 -60,-500 60,-500" transform="rotate(280)" />
            <polygon points="0,0 -60,-500 60,-500" transform="rotate(320)" />
          </g>
        </svg>
        <div id="s4-head" class="abs head" style="top: 330px; font-size: 200px; color: var(--plum)">TAZO!</div>
        <div id="s4-disc" class="disc" style="left: 260px; top: 650px; width: 560px; height: 560px">
          <svg class="face" width="560" height="560" viewBox="-300 -300 600 600">
            <circle r="296" fill="#ff5e5b" stroke="#2b1055" stroke-width="8" />
            <circle r="262" fill="none" stroke="#fff8ec" stroke-width="10" stroke-dasharray="22 16" />
            <circle r="228" fill="#2b1055" />
            <text y="-120" text-anchor="middle" font-family="Fira Sans Condensed" font-weight="700" font-size="34" letter-spacing="8" fill="#fff8ec" data-layout-ignore>DOKSANLAND</text>
            <text y="62" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="168" fill="#ffd23f">#01</text>
            <polygon points="-150,120 -142,138 -122,138 -138,150 -132,170 -150,158 -168,170 -162,150 -178,138 -158,138" fill="#1fb5a3" />
            <polygon points="150,120 158,138 178,138 162,150 168,170 150,158 132,170 138,150 122,138 142,138" fill="#1fb5a3" />
            <polygon points="0,130 8,148 28,148 12,160 18,180 0,168 -18,180 -12,160 -28,148 -8,148" fill="#ffd23f" />
          </svg>
          <svg class="face back" width="560" height="560" viewBox="-300 -300 600 600">
            <circle r="296" fill="#ff5e5b" stroke="#2b1055" stroke-width="8" />
            <circle r="262" fill="none" stroke="#fff8ec" stroke-width="10" stroke-dasharray="22 16" />
            <circle r="228" fill="#ffd23f" />
            <circle r="150" fill="none" stroke="#2b1055" stroke-width="18" stroke-dasharray="40 30" />
            <circle r="60" fill="#2b1055" />
          </svg>
        </div>
      </div>

      <!-- 9.0-12.0 question + wordmark -->
      <div id="s5" class="scene clip" data-start="9" data-duration="3" data-track-index="0">
        <div id="s5-head" class="abs head" style="top: 330px; font-size: 84px; color: var(--plum)">SENİN EN DEĞERLİ TAZON HANGİSİYDİ?</div>
        <div id="s5-disc" class="abs" style="left: 350px; top: 670px; width: 380px; height: 380px">
          <svg width="380" height="380" viewBox="-300 -300 600 600">
            <circle r="296" fill="#ff5e5b" stroke="#2b1055" stroke-width="8" />
            <circle r="262" fill="none" stroke="#fff8ec" stroke-width="10" stroke-dasharray="22 16" />
            <circle r="228" fill="#2b1055" />
            <text y="-120" text-anchor="middle" font-family="Fira Sans Condensed" font-weight="700" font-size="34" letter-spacing="8" fill="#fff8ec" data-layout-ignore>DOKSANLAND</text>
            <text y="62" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="168" fill="#ffd23f">#01</text>
            <polygon points="0,130 8,148 28,148 12,160 18,180 0,168 -18,180 -12,160 -28,148 -8,148" fill="#ffd23f" />
          </svg>
        </div>
        <div id="s5-cue" class="abs tag" style="top: 1085px"><span style="display: inline-block; padding: 14px 32px; border-radius: 999px; background: var(--plum); color: var(--yellow)">YORUMLARA YAZ</span></div>
        <div id="wordmark" class="abs" style="top: 1190px">DOKSANLAND</div>
      </div>

      <audio id="music" src="assets/music.wav" data-start="0" data-duration="12" data-volume="1" data-fade-out="0.8" data-track-index="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const B = 0.5;
      // s1: hook already legible on frame 0, settles by 0.3 s
      tl.fromTo("#s1-head", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#s1-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0.1);
      tl.fromTo("#s1-bag", { y: 120, rotation: -4 }, { y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, 0);
      tl.set("#s1-heart", { scale: 1 }, 0);
      for (let i = 0; i < 7; i++) {  // lub-dub, faster and faster
        const t = 0.1 + i * 0.26;
        tl.to("#s1-heart", { scale: 1.32, duration: 0.05, ease: "power2.out" }, t);
        tl.to("#s1-heart", { scale: 1.0, duration: 0.06, ease: "power2.in" }, t + 0.05);
        tl.to("#s1-heart", { scale: 1.18, duration: 0.04, ease: "power2.out" }, t + 0.12);
        tl.to("#s1-heart", { scale: 1.0, duration: 0.08, ease: "power2.in" }, t + 0.16);
      }
      tl.to("#s1-bag", { rotation: 3, duration: 0.07, yoyo: true, repeat: 9, ease: "sine.inOut" }, 1.1);
      // s2: tear and burst
      tl.fromTo("#s2-head", { scale: 1.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 2);
      tl.fromTo("#s2-top", { x: 0, y: 0, rotation: 0 }, { x: 260, y: -260, rotation: 38, duration: 0.6, ease: "power2.out" }, 2.25);
      tl.fromTo("#s2-top", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 2.65);
      const chipTo = [[-330, -330, -200], [-180, -420, 160], [-40, -470, -90], [120, -430, 220], [260, -360, -150], [360, -250, 110]];
      document.querySelectorAll("#s2-chips .chip").forEach((el, i) => {
        const [x, y, r] = chipTo[i];
        tl.fromTo(el, { x: 0, y: 0, rotation: 0, scale: 0.4, opacity: 0 }, { x, y, rotation: r, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.4 + i * 0.04);
        tl.to(el, { y: y + 140, rotation: r * 1.5, duration: 1.0, ease: "power1.in" }, 2.95 + i * 0.04);
      });
      tl.fromTo("#s2-bag", { scaleY: 0.94 }, { scaleY: 1, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 100%" }, 2.3);
      // s3: glow from inside
      tl.fromTo("#s3-head", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 4);
      tl.fromTo("#s3-rays", { rotation: 0, scale: 0.6, opacity: 0 }, { rotation: 45, scale: 1, opacity: 1, duration: 2.5, ease: "power1.out" }, 4);
      tl.fromTo("#s3-glint", { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, 4.5);
      for (let i = 0; i < 4; i++) {
        tl.to("#s3-glint", { scale: 1.25, duration: 0.2, ease: "sine.out" }, 5.0 + i * B);
        tl.to("#s3-glint", { scale: 0.95, duration: 0.25, ease: "sine.in" }, 5.2 + i * B);
      }
      tl.fromTo("#s3-bag", { x: -6 }, { x: 6, duration: 0.06, repeat: 13, yoyo: true, ease: "none" }, 5.6);
      // s4: TAZO! (spin lands facing front by 8.4 s)
      tl.fromTo("#s4-head", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 6.5);
      tl.fromTo("#s4-burst", { rotation: 0 }, { rotation: 60, duration: 2.5, ease: "none" }, 6.5);
      tl.fromTo("#s4-disc", { rotationY: 0, scale: 0.2, y: 300, transformPerspective: 1600 },
        { rotationY: 1080, scale: 1, y: 0, duration: 1.9, ease: "power3.out", transformPerspective: 1600 }, 6.5);
      tl.to("#s4-disc", { y: -18, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.4);
      tl.fromTo("#s4-head", { rotation: -3 }, { rotation: 3, duration: B, yoyo: true, repeat: 4, ease: "sine.inOut" }, 6.8);
      // s5: question, disc, wordmark
      tl.fromTo("#s5-head", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 9);
      tl.fromTo("#s5-disc", { scale: 0.6, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 9.1);
      tl.to("#s5-disc", { y: -20, duration: B * 2, yoyo: true, repeat: 2, ease: "sine.inOut" }, 9.6);
      tl.fromTo("#s5-cue", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.6);
      tl.fromTo("#wordmark", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 9.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

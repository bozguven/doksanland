<!DOCTYPE html>
<!-- Doksanland profile picture, 1080x1080. Instagram crops it to a circle: keep everything inside the centre 900px.
     Render: node -e (see tools in CLAUDE.md) or screenshot .card with any headless Chrome. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Unbounded;font-weight:900;src:url(fonts/unbounded-latin-900-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
.card{width:1080px;height:1080px;background:#2b1055;display:grid;place-items:center;position:relative;overflow:hidden}
.ring{width:860px;height:860px;border-radius:50%;background:#ffd23f;display:grid;place-items:center;position:relative;
 box-shadow:0 0 0 26px #fff8ec,0 0 0 40px #ff5e5b}
.ring::before{content:"";position:absolute;inset:46px;border-radius:50%;border:8px dashed #2b105566}
.word{font:900 150px/.92 Unbounded;color:#2b1055;letter-spacing:-.04em;text-align:center;transform:rotate(-6deg)}
.word span{display:block}
.dot{position:absolute;width:70px;height:70px;border-radius:50%;background:#1fb5a3;right:150px;top:170px}
</style>
</head>
<body>
<div class="card"><div class="ring"><div class="word"><span>DOK</span><span>SAN</span><span>LAND</span></div><div class="dot"></div></div></div>
<script>document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });</script>
</body>
</html>
